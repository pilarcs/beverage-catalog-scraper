name: coleta-diaria

on:
  workflow_dispatch: {}

concurrency:
  group: coleta-cosmos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest

    # SUCESSÃO: mude apenas o nome abaixo. Ele escolhe o secret <NOME>_COSMOS_TOKEN e vira o rótulo
    # gravado nos dados (COLETOR_RESPONSAVEL). A lista tem de ter exatamente um nome: só uma pessoa
    # coleta por vez, cada uma com a própria conta do Cosmos.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        cred: [PILAR]

    env:
      COSMOS_TOKEN: ${{ secrets[format('{0}_COSMOS_TOKEN', matrix.cred)] }}
      COLETOR_RESPONSAVEL: ${{ matrix.cred }}

    steps:
      - name: Baixando o repositorio
        uses: actions/checkout@v7

      - name: Preparando Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Coletar páginas do Cosmos (credencial ${{ matrix.cred }})
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m coletor

      - name: Verificar que o token não vazou nos dados
        if: always()
        id: varredura
        run: |
          mkdir -p dados saida
          if [ -n "$COSMOS_TOKEN" ] && grep -R -F -q -- "$COSMOS_TOKEN" dados saida; then
            echo "::error::Token encontrado nos arquivos a commitar; commit cancelado."
            exit 1
          fi

      - name: Salvar dados no repositório
        if: ${{ always() && steps.varredura.outcome == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p dados saida
          git add dados saida
          if git diff --cached --quiet; then
            echo "Sem mudanças para salvar."
            exit 0
          fi
          git commit -m "chore: coleta $(date -u +%Y-%m-%dT%H:%MZ)"
          for tentativa in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              echo "Dados salvos (tentativa $tentativa)."
              exit 0
            fi
            echo "Push falhou (tentativa $tentativa); reconciliando com o repositório..."
            git rebase --abort || true
            rm -rf "$RUNNER_TEMP/anterior"
            mkdir -p "$RUNNER_TEMP/anterior"
            cp -r dados saida "$RUNNER_TEMP/anterior"/
            git fetch origin
            git reset --hard origin/main
            mkdir -p dados/bruto saida
            cp -rn "$RUNNER_TEMP/anterior/dados/bruto/." dados/bruto/ || true
            python -m coletor --reconciliar --anterior "$RUNNER_TEMP/anterior"
            git add dados saida
            if git diff --cached --quiet; then
              echo "Nada de novo depois da reconciliação (a execução não trouxe páginas)."
              exit 0
            fi
            git commit -m "chore: coleta reconciliada $(date -u +%Y-%m-%dT%H:%MZ)"
            sleep 5
          done
          echo "::error::Não foi possível salvar os dados após 5 tentativas."
          exit 1

      # Só guarda o artifact se a varredura do token passou: se ela falhou, os arquivos podem conter
      # o token, e publicá-los como artifact num repositório público seria o mesmo vazamento.
      - name: Guardar dados como artifact se algo falhar
        if: ${{ failure() && steps.varredura.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: dados-${{ github.run_id }}
          path: |
            dados
            saida
          retention-days: 30
          if-no-files-found: ignore
